<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOC 全国導入マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* 色はここだけ変えればサイト全体に反映されます */
  --bg:#f3f4f6;          /* ページ背景 */
  --surface:#ffffff;     /* カード */
  --ink:#1f2633;         /* 本文 */
  --muted:#6b7380;       /* 補足テキスト */
  --line:#e2e5ea;        /* 罫線 */
  --won:#d7263d;         /* 受注済み(赤) */
  --won-dark:#a3172b;    /* 受注済み(選択・ホバー) */
  --empty:#c8ccd2;       /* 未受注(グレー) */
  --empty-dark:#a9aeb6;
  --font:"Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
  /* レイアウト: 左に地図、右上にサマリー、その下に県別一覧 */
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:24px 20px 40px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
header.top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
header.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.meta{font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.map-card{padding:16px;display:flex;flex-direction:column;gap:12px;position:relative}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
svg.map{width:100%;height:auto;display:block}
svg.map path.pref{stroke:#fff;stroke-width:.45;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
svg.map path.pref.won{fill:var(--won)}
svg.map path.pref.none{fill:var(--empty)}
svg.map path.pref.won:hover,svg.map path.pref.won.sel{fill:var(--won-dark)}
svg.map path.pref.none:hover,svg.map path.pref.none.sel{fill:var(--empty-dark)}
svg.map path.pref.sel{stroke:var(--ink);stroke-width:1.2}
svg.map path.pref:focus{outline:none;stroke:var(--ink);stroke-width:1.4}
svg.map .inset{fill:none;stroke:var(--line);stroke-width:1}
svg.map .inset-label{font-size:9px;fill:var(--muted);font-family:var(--font)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .1s}
.tip b{font-variant-numeric:tabular-nums}
.detail{border-top:1px solid var(--line);padding-top:12px;min-height:72px}
.detail h3{margin:0 0 6px;font-size:15px;display:flex;align-items:baseline;gap:10px}
.detail h3 .n{font-size:13px;font-weight:700;color:var(--won)}
.detail h3 .n.zero{color:var(--muted)}
.detail ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.detail li{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.detail p{margin:0;color:var(--muted);font-size:12px}
aside{display:flex;flex-direction:column;gap:16px}
.summary{padding:18px}
.summary .label{font-size:12px;color:var(--muted);font-weight:500}
.big{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.big strong{font-size:44px;font-weight:900;line-height:1.1;color:var(--won)}
.big span{font-size:18px;font-weight:700;color:var(--muted)}
.bar{height:8px;background:var(--empty);border-radius:999px;overflow:hidden;margin:10px 0 4px}
.bar div{height:100%;background:var(--won);border-radius:999px}
.pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--bg);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.stat b small{font-size:12px;font-weight:500;margin-left:2px}
.remain{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:inherit;font-size:12px;border:1px dashed var(--empty-dark);background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px;cursor:pointer}
.chip:hover,.chip:focus-visible{border-style:solid;border-color:var(--ink);outline:none}
.done{font-size:13px;font-weight:700;color:var(--won)}
.list{padding:6px 0}
.list h2{font-size:13px;margin:0;padding:10px 18px 6px;display:flex;justify-content:space-between;color:var(--ink)}
.list h2 span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.region{padding:0 10px 6px}
.region h4{margin:8px 8px 4px;font-size:11px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
.row{font:inherit;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 8px;border:0;border-radius:6px;background:none;color:var(--ink);cursor:pointer;text-align:left}
.row:hover,.row:focus-visible{background:var(--bg);outline:none}
.row.sel{background:var(--bg);box-shadow:inset 3px 0 0 var(--ink)}
.row .c{font-variant-numeric:tabular-nums;font-weight:700;min-width:28px;text-align:center;border-radius:999px;font-size:12px;padding:0 6px}
.row.won .c{background:var(--won);color:#fff}
.row.none{color:var(--muted)}
.row.none .c{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
footer{font-size:11px;color:var(--muted)}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><small>どこでもオープンカンパニー</small>全国47都道府県 導入マップ</h1>
    <div class="meta"><span>最終更新 <b id="updated">-</b></span><span>毎月15日に自動更新</span></div>

  <div class="grid">

        <div class="bar"><div id="bar" style="width:0"></div></div>
        <div class="pct" id="pct"></div>
        <div class="stats">
          <div class="stat"><span class="label">導入社数</span><b id="total">-<small>社</small></b></div>
          <div class="stat"><span class="label">未導入</span><b id="left">-<small>県</small></b></div>
        </div>
        <div class="remain"><span class="label">あと少し: 未導入の都道府県</span><div class="chips" id="chips"></div></div>

      <section class="card list" aria-label="都道府県別の受注社数">
        <h2>都道府県別 受注社数 <span id="listTotal"></span></h2>
        <div id="regions"></div>
      </section>
    </aside>
  </div>
  <footer>※ 導入企業の所在地(本社所在地)の都道府県で集計しています。</footer>
</div>

  const reg = $("regions"); reg.innerHTML = "";
  for(const [title,a,z] of REGIONS){
    const group = PREFS.filter(p=>p.id>=a && p.id<=z);
    const sum = group.reduce((s,p)=>s+count(p.name),0);
    const wonN = group.filter(p=>count(p.name)>0).length;
    const d = document.createElement("div"); d.className="region";
    d.innerHTML = `<h4><span>${title}</span><span>${wonN}/${group.length}県・${sum}社</span></h4>`;
    const rows = document.createElement("div"); rows.className="rows";
    for(const p of group){
      const c = count(p.name);
      const b = document.createElement("button"); b.type="button";
      b.className = "row " + (c>0?"won":"none") + (p.name===selected?" sel":"");
      b.innerHTML = `<span>${p.name}</span><span class="c">${c}</span>`;
      b.addEventListener("click",()=>select(p.name));
      rows.appendChild(b);
    }
    d.appendChild(rows); reg.appendChild(d);
  }
  renderDetail();
}

function renderDetail(){
  const el = $("detail");
  if(!selected){ el.innerHTML = '<p>地図または右の一覧から都道府県を選ぶと、ここに受注社数が表示されます。</p>'; return; }
  const c = count(selected);
  const reg = REGIONS.find(([,a,z])=>{ const p = PREFS.find(p=>p.name===selected); return p && p.id>=a && p.id<=z; });
  el.innerHTML = `<h3>${selected}<span class="n${c?"":" zero"}">${c ? c+"社 受注済み" : "未受注"}</span></h3>` +
    `<p>${c ? (reg ? reg[0] + "エリアで導入いただいています。" : "") : "まだ導入企業がありません。導入1社目を目指しています。"}</p>`;
}

function select(name){ selected = (selected===name? null : name); paint(); }

function showTip(e, name){
  const tip = $("tip"), card = tip.parentElement.getBoundingClientRect();
  const c = count(name);
  tip.innerHTML = `${name} <b>${c ? c+"社" : "未受注"}</b>`;
  tip.style.left = (e.clientX - card.left) + "px";
  tip.style.top = (e.clientY - card.top) + "px";
  tip.style.opacity = 1;
}
function hideTip(){ $("tip").style.opacity = 0; }

async function loadData(){
  // 1) Google Apps Script 上ではスプレッドシートを直接読む
  if(window.google && google.script && google.script.run){
    return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej).getMapData());
  }
  // 2) 公開ページでは同じ場所の data.json を読む(毎月自動更新)
  const r = await fetch("data.json", {cache:"no-store"});
  if(!r.ok) throw new Error("data.json " + r.status);
  return r.json();
}

drawMap(); paint();
loadData().then(d=>{ if(d && d.prefectures){ DATA = d; paint(); } }).catch(()=>{});
</script>
